name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Read-only token: the workflow can't push, release or change settings.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs; tags can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Exact install from package-lock.json; .npmrc disables install scripts.
      - run: npm ci

      # Every package must carry a valid npm registry signature.
      - run: npm audit signatures

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Dry run: catches manifest mistakes before release.
      - run: npm run package -- --out "$RUNNER_TEMP/0xword.vsix"
